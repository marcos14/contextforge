services:
  postgres:
    image: postgres:16-alpine
    container_name: mcpb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contextforge
      POSTGRES_PASSWORD: contextforge
      POSTGRES_DB: contextforge
    volumes:
      - mcpb_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextforge -d contextforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    container_name: mcpb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mcpb_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  contextforge:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args:
        APP_PORT: ${CONTEXTFORGE_CONTAINER_PORT:-8080}
    container_name: mcpb-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    ports:
      - "${CONTEXTFORGE_HOST_PORT:-8080}:${CONTEXTFORGE_CONTAINER_PORT:-8080}"

  # Optional profile: image bundled with Oracle Instant Client (godror).
  # Activate with: docker compose --profile oracle up
  contextforge-oracle:
    profiles: ["oracle"]
    build:
      context: ..
      dockerfile: deploy/backend.oracle.Dockerfile
      args:
        APP_PORT: ${CONTEXTFORGE_CONTAINER_PORT:-8080}
    container_name: mcpb-app-oracle
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    ports:
      - "${CONTEXTFORGE_ORACLE_HOST_PORT:-8081}:${CONTEXTFORGE_CONTAINER_PORT:-8080}"

volumes:
  mcpb_pg_data:
  mcpb_redis_data:
